# HWW

sample_json: "single/samples_run2_2L_1FJ.json"
base_path: "root://eosuser.cern.ch//eos/user/r/rband/HVV2LRDF/merged_2lep_1FJ_r2_2lep_1FJ_20260615211230_2lep_1FJ/"
local_base_path: "/groups/cjessop/users/jkil/HVV_2L_RDF/run2_1FJ/"

training_features:
  - L1_pt: log
  - L2_pt: log
  - L1_eta: minmax
  - L2_eta: minmax
  - L1_phi: minmax
  - L2_phi: minmax
  - L1_mass: log
  - L2_mass: log
  - met_pt: log
  - met_phi: minmax
  - FJ1_pt: log
  - FJ1_eta: minmax
  - FJ1_phi: minmax
  - FJ1_massGloParT3: log
  - FJ1_msoftdrop: log
  - FJ1_tau2: none
  - FJ1_tau1: none

derived_vars: {}

# make sure to include 'weight' field here
extra_vars:
  - weight
  - FJ1_Hbb

constraint_var: "vbs_score"

preselection: "(FJ1_Hbb >= 0.1)" # Hbb tag score, need to work on optimal cut

learning_rate: 0.001
batch_size: 4096
n_epochs: 1000

architecture: [64, 32, 16]
bce_weight: 1.0
disco_lambda: 10.0

closure_n_events_min: 10
closure_symmetrize: true
use_batchnorm: true
dropout: 0.2
weight_decay: 0.01
label_smoothing: 0.0

devices: [0]

output: "run2_2L_1FJ"