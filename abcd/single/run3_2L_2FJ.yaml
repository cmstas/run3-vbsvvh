# HWZ / HZZ

sample_json: "single/samples_run3_2L_2FJ.json"
base_path: "root://eosuser.cern.ch//eos/user/r/rband/HVV2LRDF/merged_2lep_2FJ_r3_2lep_2FJ_20260615211951_2lep_2FJ/"
local_base_path: "/groups/cjessop/users/jkil/HVV_2L_RDF/run3_2FJ/"

training_features:
  - L1_pt: log
  - L2_pt: log
  - L1_eta: minmax
  - L2_eta: minmax
  - L1_phi: minmax
  - L2_phi: minmax
  - L1_mass: log
  - L2_mass: log
  - met_pt: log
  - met_phi: minmax
  - FJ1_pt: log
  - FJ2_pt: log
  - FJ1_eta: minmax
  - FJ2_eta: minmax
  - FJ1_phi: minmax
  - FJ2_phi: minmax
  - FJ1_massGloParT3: log
  - FJ2_massGloParT3: log
  - FJ1_msoftdrop: log # only in 2FJ maybe
  - FJ2_msoftdrop: log
  - FJ1_tau2: none
  - FJ2_tau2: none
  - FJ1_tau1: none
  - FJ2_tau1: none
  - ht_fatjets: log # only in 2FJ good

derived_vars: {}
# auto_include_derived_vars: false
# auto_include_derived_vars_transform: none

extra_vars:
  - weight
  - FJ1_Hbb
  - FJ2_Hbb

constraint_var: "vbs_score"

preselection: "(FJ1_Hbb >= 0.1) | (FJ2_Hbb >= 0.1)"

learning_rate: 0.001
batch_size: 4096
n_epochs: 1000

architecture: [64, 32, 16]
bce_weight: 1.0
disco_lambda: 10.0

closure_n_events_min: 10
closure_symmetrize: true
use_batchnorm: true
dropout: 0.2
weight_decay: 0.01
label_smoothing: 0.0

devices: [0]

output: "run3_2L_2FJ"