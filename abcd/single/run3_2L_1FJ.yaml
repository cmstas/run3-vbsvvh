# HWW

sample_json: "single/samples_run3_2L_1FJ.json"
base_path: "root://eosuser.cern.ch//eos/user/r/rband/HVV2LRDF/merged_2lep_1FJ_r3_2lep_1FJ_20260615211529_2lep_1FJ/"
local_base_path: "/groups/cjessop/users/jkil/HVV_2L_RDF/run3_1FJ/"

training_features:
  - L1_pt: log
  - L2_pt: log
  - L1_eta: minmax
  - L2_eta: minmax
  - L1_phi: minmax
  - L2_phi: minmax
  - L1_mass: log
  - L2_mass: log
  - met_pt: log
  - met_phi: minmax
  - FJ1_pt: log
  - FJ1_eta: minmax
  - FJ1_phi: minmax
  - FJ1_massGloParT3: log
  - FJ1_msoftdrop: log
  - FJ1_tau2: none
  - FJ1_tau1: none

derived_vars: {}
auto_include_derived_vars: false
auto_include_derived_vars_transform: none

extra_vars:
  - weight
  # - boosted_h_candidate_score
  # - boosted_v_candidate_score
  - FJ1_Hbb
  - vbs_detajj

constraint_var: "vbs_score"

# preselection: "(boosted_h_candidate_score >= 0.1) & (boosted_v_candidate_score >= 0.1)"
preselection: "(FJ1_Hbb >= 0.1)"

learning_rate: 0.001
batch_size: 2048
n_epochs: 1000

architecture: [64, 32, 16]
bce_weight: 1.0
disco_lambda: 5.0

use_batchnorm: true
dropout: 0.2
weight_decay: 0.01
label_smoothing: 0.0

devices: [1]

output: "run3_2L_1FJ"