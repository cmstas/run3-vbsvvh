# HWZ / HZZ

sample_json: "single/samples_run2_2L_2FJ.json"
base_path: "root://eosuser.cern.ch//eos/user/r/rband/HVV2LRDF/merged_2lep_2FJ_r2_2lep_2FJ_20260615211710_2lep_2FJ/"
local_base_path: "/groups/cjessop/users/jkil/HVV_2L_RDF/run2_2FJ/"

training_features: # tag higgs jet first, higher Hbb score is Higgs jet
  - L1_pt: log
  - L2_pt: log
  - L1_eta: minmax
  - L2_eta: minmax
  - L1_phi: minmax
  - L2_phi: minmax
  - L1_mass: log # may be almost useless since it basically distinguishes electrons and muons, and sig vs bkg have similar flavor composition, so this doesn't give useful info in training.
  - L2_mass: log
  - met_pt: log
  - met_phi: minmax
  - FJ1_pt: log
  - FJ2_pt: log
  - FJ1_eta: minmax
  - FJ2_eta: minmax
  - FJ1_phi: minmax
  - FJ2_phi: minmax
  - FJ1_massGloParT3: log
  - FJ2_massGloParT3: log
  - FJ1_msoftdrop: log
  - FJ2_msoftdrop: log
  - FJ1_tau2: none
  - FJ2_tau2: none
  - FJ1_tau1: none
  - FJ2_tau1: none
  - ht_fatjets: log # only in 2FJ good
  # - nFatJets: minmax # only in 2FJ

derived_vars: {}

extra_vars:
  - weight
  - FJ1_Hbb
  - FJ2_Hbb

constraint_var: "vbs_score"

preselection: "(FJ1_Hbb >= 0.1) | (FJ2_Hbb >= 0.1)"
# need to look which jet is selected

learning_rate: 0.001
batch_size: 4096
n_epochs: 1000

architecture: [64, 32, 16]
bce_weight: 1.0
disco_lambda: 10.0

closure_n_events_min: 10
closure_symmetrize: true
use_batchnorm: true
dropout: 0.2
weight_decay: 0.01
label_smoothing: 0.0

devices: [0]

output: "run2_2L_2FJ"

