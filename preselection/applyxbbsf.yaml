# GloParT-3 Xbb tagging SFs written per fat jet (see src/xbb_sf.h). Every channel must
# be listed; a channel with no keys gets no Xbb SF branches.
#
#   flags: [[w], [w1, w2]]   one branch triple per WP set, for WPs used as a hard cut or as
#                            flags (e.g. NN inputs): a one-WP set gives pass SF / fail SF,
#                            a multi-WP set the weight of the exclusive score interval.
#                            Needs the candle MC efficiency (Xbb_eff_MC) in the era files.
#
# The score is FatJet_Hbb = Xbb / (Xbb + QCD); only true b jets (FatJet_genMatch 5, H->bb) get SFs.
# WPs must lie within the measured range of corrections/scalefactors/XbbSF (0.50-0.99);
# within a flags set they must be strictly increasing. Example (a channel cutting FatJet_Hbb > 0.5):
#
#   2lep_1FJ:
#     flags: [[0.50]]
all_events:
0lep_0FJ:
0lep_1FJ:
0lep_1FJ_met:
0lep_2FJ:
0lep_2FJ_met:
0lep_3FJ:
1lep_1FJ:
1lep_2FJ:
1lep_WSF:
2lep_1FJ:
2lepSS:
2lep_2FJ:
3lep:
4lep:
