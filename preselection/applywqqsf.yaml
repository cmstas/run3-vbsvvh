# GloParT-3 Wqq tagging SFs written per fat jet (see src/wqq_sf.h). Every channel must
# be listed; a channel with no keys gets no Wqq SF branches.
#
#   flags: [[w], [w1, w2]]   one branch triple per WP set, for WPs used as a hard cut or as
#                            flags (e.g. NN inputs): a one-WP set gives pass SF / fail SF,
#                            a multi-WP set the weight of the exclusive score interval.
#                            Needs the candle MC efficiency (Wqq_eff_MC) in the era files.
#
# WPs must lie within the measured range of corrections/scalefactors/WqqSF (0.40-0.98);
# within a flags set they must be strictly increasing. Example:
#
#   0lep_1FJ_met:
#     flags: [[0.60], [0.40, 0.60, 0.80]]
all_events:
0lep_0FJ:
0lep_1FJ:
0lep_1FJ_met:
0lep_2FJ:
0lep_2FJ_met:
0lep_3FJ:
1lep_1FJ:
1lep_2FJ:
1lep_WSF:
2lep_1FJ:
2lepSS:
2lep_2FJ:
