# AK4 b-tagger of each era. The discriminant branch, working-point thresholds and
# BTV SF payload are all read from here (src/btag_settings.cpp). Input and output
# branches keep their NanoAOD names (Jet_btagUParTAK4B, Jet_btagPNetB, ...).
taggers:
  UParTAK4:
    score_branch: Jet_btagUParTAK4B
    payload_prefix: UParTAK4
  particleNet:
    score_branch: Jet_btagPNetB
    payload_prefix: particleNet

# BTV payloads are pinned to a dated version rather than `latest`, so that a new BTV
# release cannot silently change the SFs or their systematic labels.
# sf_max_abseta is the upper |eta| edge of the SF payload. Only the SF lookup
# coordinate is clamped below it; jets in the acceptance are not discarded.
# 2025 recommendation: https://btv-wiki.docs.cern.ch/ScaleFactors/Run3Prompt25/
eras:
  2016preVFP:
    tagger: UParTAK4
    payload: /cvmfs/cms-griddata.cern.ch/cat/metadata/BTV/Run2-2016preVFP-UL-NanoAODv15/2026-06-18/btagging.json.gz
    sf_max_abseta: 2.4
  2016postVFP:
    tagger: UParTAK4
    payload: /cvmfs/cms-griddata.cern.ch/cat/metadata/BTV/Run2-2016postVFP-UL-NanoAODv15/2026-06-18/btagging.json.gz
    sf_max_abseta: 2.4
  2017:
    tagger: UParTAK4
    payload: /cvmfs/cms-griddata.cern.ch/cat/metadata/BTV/Run2-2017-UL-NanoAODv15/2026-06-18/btagging.json.gz
    sf_max_abseta: 2.4
  2018:
    tagger: UParTAK4
    payload: /cvmfs/cms-griddata.cern.ch/cat/metadata/BTV/Run2-2018-UL-NanoAODv15/2026-06-18/btagging.json.gz
    sf_max_abseta: 2.4
  # UParTAK4 has no fixed-WP calibration for the 2022/2023 (NanoAODv12) eras.
  2022Re-recoBCD:
    tagger: particleNet
    payload: /cvmfs/cms-griddata.cern.ch/cat/metadata/BTV/Run3-22CDSep23-Summer22-NanoAODv12/2025-08-20/btagging.json.gz
    sf_max_abseta: 2.5
  2022Re-recoE+PromptFG:
    tagger: particleNet
    payload: /cvmfs/cms-griddata.cern.ch/cat/metadata/BTV/Run3-22EFGSep23-Summer22EE-NanoAODv12/2025-08-20/btagging.json.gz
    sf_max_abseta: 2.5
  2023PromptC:
    tagger: particleNet
    payload: /cvmfs/cms-griddata.cern.ch/cat/metadata/BTV/Run3-23CSep23-Summer23-NanoAODv12/2025-08-20/btagging.json.gz
    sf_max_abseta: 2.5
  2023PromptD:
    tagger: particleNet
    payload: /cvmfs/cms-griddata.cern.ch/cat/metadata/BTV/Run3-23DSep23-Summer23BPix-NanoAODv12/2025-08-20/btagging.json.gz
    sf_max_abseta: 2.5
  2024Prompt:
    tagger: UParTAK4
    payload: /cvmfs/cms-griddata.cern.ch/cat/metadata/BTV/Run3-24CDEReprocessingFGHIPrompt-Summer24-NanoAODv15/2026-10-14/btagging.json.gz
    sf_max_abseta: 2.5
  2025:
    tagger: UParTAK4
    payload: /cvmfs/cms-griddata.cern.ch/cat/metadata/BTV/Run3-25Prompt-Summer24-NanoAODv15/2026-10-14/btagging.json.gz
    sf_max_abseta: 2.5
